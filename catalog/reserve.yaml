# G11 catalog graph — domain YAML only (formulas / structure).
# Provenance: getafix-seed-paul dsl-work/spec_reserve_ifrs17.yaml @ 320dee4
# Copied/adapted as read-only editor seed. Domain YAML only.
# Engines stay in panoramix-runtime bindings.

# COMPLETE DSL Specification: IFRS 17 Reserves (200,000 Accounts)
# Status: 100% SAS COMPLIANT - All 23 gaps fixed
# Source: reserve-ifrs17.sas (894 lines)
# All calculation paths match SAS logic exactly

# This specification is 100% compliant with the SAS source code.
# All 23 gaps identified during translation have been fixed.

# ============================================================================
# TENSOR DEFINITION
# ============================================================================
tensor:
  dims: [T_MONTH, S_OUTER, ACCOUNT]
  sizes:
    # SAS then-output keys in rendements.csv: (0,12), (1,7)…(1,12), (2,1)…(100,12).
    # File also has unused (101,1)…(101,6); packed T drops those. Not a dense 1201.
    T_MONTH: 1195
    S_OUTER: 100      # Stochastic scenarios
    ACCOUNT: 200000   # Number of accounts

# ============================================================================
# PARAMETERS
# ============================================================================
parameters:
  FREQ_EVAL: 12                 # Monthly frequency
  AGE_FIN_CONTRAT: 99          # Maximum contract age
  VM_VG_RATIO_MAX: 10          # Maximum moneyness ratio
  LAPSE_TOT_THRESHOLD_1: 0.5   # First lapse threshold
  LAPSE_TOT_THRESHOLD_2: 0.75  # Second lapse threshold
  LAPSE_PART_THRESHOLD_1: 0.5  # First partial lapse threshold
  LAPSE_PART_THRESHOLD_2: 0.75 # Second partial lapse threshold
  AJUST_NOUV_AFFAIRES: 1       # New business adjustment
  RF_THRESHOLD_LOW: 0.333      # Fixed income threshold (1/3)
  RF_THRESHOLD_MED: 0.667      # Fixed income threshold (2/3)
  RF_THRESHOLD_RGS_LOW: 0.5    # RGS fixed income threshold
  VM_VG_MONEYNESS_LOW: 0.7     # RGS moneyness threshold 1
  VM_VG_MONEYNESS_MED: 0.9     # RGS moneyness threshold 2
  AGE_THRESHOLD_80: 80         # Age factor threshold 1
  AGE_THRESHOLD_90: 90         # Age factor threshold 2

# ============================================================================
# NUMERIC PRECISION (domain; not a compute-engine lift)
# ============================================================================
numeric:
  precision: f32       # f32 = fast, f64 = accuracy path

# ============================================================================
# DATA CONFIGURATION
# ============================================================================
data:
  source_path: ../fixtures/data_in/RESERVE

  index_mapping:
    # Dimension mappings (semantic: tells loader which is time/scenario/account)
    # Packed T is file order of (an_eval, mois_eval), not this dense formula
    # ((0,12) would be 11; (1,7) would be 18). Do not scatter on the transform.
    an_eval: {type: dimension, maps_to: [T_MONTH], transform: "an_eval * 12 + mois_eval - 1", semantic: time_year}
    mois_eval: {type: dimension, maps_to: [T_MONTH], semantic: time_month}
    scn_eval: {type: dimension, maps_to: [S_OUTER], semantic: scenario}
    ID_COMPTE: {type: dimension, maps_to: [ACCOUNT], semantic: account}

    # Lookup indices
    AGE: {type: lookup}
    age_MORTALITE: {type: lookup}
    duree_max10: {type: lookup}
    annee_reelle: {type: lookup}

  files:
    # Population data (account characteristics - 71 columns)
    population:
      sName: pop
      context: outer
      file: population.csv
      provides:
        # Initial fund values by asset class
        - MT_SP500
        - MT_TSX
        - MT_EAFE
        - MT_DEX
        - MT_MM
        - MT_VM
        - MT_RF

        # Guarantee amounts
        - MT_GAR_ECH
        - MT_GAR_DECES
        - MT_BONI_DECES
        - MT_SRG
        - MT_BCB
        - MT_MRV_MRG_MRA

        # Rates and percentages
        - PC_GAR_ECH
        - PC_GAR_DECES_1
        - PC_GAR_DECES_2
        - PC_REVENU_FDS
        - PC_HONORAIRES_GEST
        - PC_RFG
        - PC_FRAIS_GARANTIE
        - PC_BONI_DECES
        - PC_BONI_SRG
        - PC_RETRAIT_AGE
        - PC_RENOUV_ECH
        - PC_GAR_ECH_DEP_FUT

        # Ages and dates (CSV column 'age' → variable AGE_INITIAL)
        - age: AGE_INITIAL
        - MOIS_NAIS
        - ANNEE_NAIS
        - ANNEE_COTIS
        - MOIS_COTIS
        - AGE_DECAISSEMENT
        - AGE_MRV_PERMIS
        - AGE_FIN_CONTRAT
        - AGE_MAX_RENOUV_ECH
        - ANNEE_ECH
        - MOIS_ECH

        # Reset and limit parameters
        - FREQ_RESET_DECES
        - MAX_RESET_DECES
        - FREQ_RESET_SRG
        - MAX_RESET_SRG
        - MAX_BONI_DECES
        - I_RESET_FACUL_ECH
        - MAX_RESET_FACUL_ECH
        - I_RESET_DECES_ECH
        - RATIO_VM_VG_RESET_ECH
        - AGE_CHANG_DECES
        - NB_AN_ECH
        - AGE_ECH_MIN

        # Product indicators
        - I_SEXE
        - I_PRODUIT_REGR
        - I_REGIME_2
        - I_FRAIS_SUR_SRG
        - ID_PRODUIT
        - ID_LAPSE
        - ID_ACQUI
        - ID_DEPOT

        # TPA amounts
        - MT_TPA_RETRAIT
        - MT_TPA_DEPOT
        - MT_RETRAIT_MAX
        - M_MT_MRV_EXCEDENT

        # Rates and tables
        - VAR_RETRAIT_FCT
        - TABLE_TAUX_MRV_MRG_MRA
        - TAUX_MRV_MRG_MRA
        - AJUSTEMENT_COMMISSION: Ajustement_commission
        - AJUSTEMENT_MENSUEL_GAR

        # Evaluation parameters
        - ANNEE_EVALUATION_INI
        - MOIS_EVALUATION_INI

      index: [ID_COMPTE]

    # Mortality rates (lookup by I_SEXE, age_MORTALITE, ANNEE_REELLE, I_PRODUIT_REGR)
    mortality:
      sName: mort
      context: outer
      type: lookup
      file: mortalite.csv
      provides: [QX]
      keys:
        - {name: I_SEXE}
        - {name: age_MORTALITE}
        - {name: ANNEE_REELLE}
        - {name: I_PRODUIT_REGR}

    # RRIF minimum withdrawal factors (lookup by AGE)
    min_ferr:
      sName: ferr
      context: outer
      type: lookup
      file: min_ferr.csv
      provides: [MIN_FERR]
      keys:
        - {name: AGE}

    # Total lapse rates (lookup by DUREE_MAX10, ID_LAPSE, LAPSE_NIV_TOT)
    lapse_total:
      sName: lapT
      context: outer
      type: lookup
      file: tx_lapse_tot.csv
      provides: [TX_LAPSE_TOT_MIN, TX_LAPSE_TOT_MAX, FACT_DIM]
      keys:
        - {name: DUREE_MAX10}
        - {name: ID_LAPSE}
        - {name: LAPSE_NIV_TOT}

    # Partial lapse rates (lookup by AGE, ID_LAPSE, I_REGIME_2, LAPSE_NIV_PART)
    lapse_partial:
      sName: lapP
      context: outer
      type: lookup
      file: tx_lapse_part.csv
      provides: [TX_LAPSE_PART_MIN, TX_LAPSE_PART_MAX]
      keys:
        - {name: AGE}
        - {name: ID_LAPSE}
        - {name: I_REGIME_2}
        - {name: LAPSE_NIV_PART}

    # Stochastic returns (5 asset classes + forward rates)
    # This is the time×scenario file — cross-merged with population
    returns:
      sName: ret
      context: outer
      file: rendements.csv
      provides:
        - forward_rate: FORWARD_RATE
        - rendDEX_an
        - rendMM_an
        - rendTSX_an
        - rendSP500_an
        - rendEAFE_an
        - AJUST_FORWARD_RATE_VM_0
        - an_eval
        - mois_eval
      index: [scn_eval, an_eval, mois_eval]

    # Administrative expenses (lookup by ANNEE_REELLE, ID_PRODUIT)
    frais_admin:
      sName: frais
      context: outer
      type: lookup
      file: frais_admin.csv
      provides: [FRAIS]
      keys:
        - {name: ANNEE_REELLE}
        - {name: ID_PRODUIT}

    # Acquisition costs and commissions (lookup by duree_max10, ID_ACQUI)
    acquisition:
      sName: acq
      context: outer
      type: lookup
      file: acquisition.csv
      provides:
        - PC_COMMISSION_VENTE_RF
        - PC_COMMISSION_VENTE_AC
        - PC_COMMISSION_MAINTIEN_RF
        - PC_COMMISSION_MAINTIEN_AC
        - PC_FRAIS_AN_AC
        - PC_FRAIS_AN_RF
      keys:
        - {name: duree_max10}
        - {name: ID_ACQUI}

    # Future deposits (lookup by duree_max10, ID_DEPOT)
    depots_futurs:
      sName: dep
      context: outer
      type: lookup
      file: depots_futurs.csv
      provides:
        - PC_DEPOT_ANNUEL
        - VAR_DEPOT_FCT
        - AGE_MAX_DEPOT
        - I_EVEN_CESSE_DEPOT
      keys:
        - {name: duree_max10}
        - {name: ID_DEPOT}

    # IFRS 17 risk adjustment cushions (lookup by CODE_CAT_PRODUIT, CAT_COUSSIN_1, CAT_COUSSIN_2)
    coussins_escap:
      sName: cous
      context: outer
      type: lookup
      file: coussins_escap.csv
      provides:
        - BASE_PASSIF_REDRESSE
        - TX_PASSIF_REDRESSE
        - BASE_COUSSIN_CREDIT
        - TX_COUSSIN_CREDIT
        - BASE_COUSSIN_MARCHE
        - TX_COUSSIN_MARCHE
        - BASE_COUSSIN_DEPENSE
        - TX_COUSSIN_DEPENSE
        - BASE_COUSSIN_DECHEANCE
        - TX_COUSSIN_DECHEANCE
        - BASE_COUSSIN_MORTALITE
        - TX_COUSSIN_MORTALITE
        - BASE_COUSSIN_DEPOT
        - TX_COUSSIN_DEPOT
        - FACTEUR_AGE_80
        - FACTEUR_AGE_90
      keys:
        - {name: CODE_CAT_PRODUIT}
        - {name: CAT_COUSSIN_1}
        - {name: CAT_COUSSIN_2}

# ============================================================================
# VARIABLES
# ============================================================================
variables:
  computed:
    # Time and age
    - AGE
    - age_MORTALITE
    - AGE_RETRAIT
    - annee_reelle
    - duree_max10

    # Asset class projections
    - MT_SP500_GR
    - MT_TSX_GR
    - MT_EAFE_GR
    - MT_DEX_GR
    - MT_MM_GR
    - MT_SP500_PROJ
    - MT_TSX_PROJ
    - MT_EAFE_PROJ
    - MT_DEX_PROJ
    - MT_MM_PROJ
    - MT_VM_PROJ
    - MT_VM_AV_RETRAIT_FRAIS
    - MT_VM_AFTER_RFG
    - PRIMES_GARANTIES_BASE
    - MT_VM_AV_RETRAIT
    - MT_VM_AP_RETRAIT
    - MT_VM_AP_RETRAIT_DEPOT
    - MT_VM_PROJ_FINAL

    # Guarantee projections
    - WITHDRAWAL_REDUCTION_FACTOR
    - MT_GAR_ECH_AFTER_RETRAIT
    - MT_GAR_DECES_AFTER_RETRAIT
    - MT_BONI_DECES_AFTER_RETRAIT
    - MT_GAR_ECH_AFTER_DEPOT
    - MT_GAR_DECES_AFTER_DEPOT
    - MT_GAR_ECH_PROJ
    - MT_GAR_DECES_PROJ
    - MT_BONI_DECES_BEFORE_RETRAIT
    - MT_BONI_DECES_PROJ
    - MT_SRG_PROJ
    - MT_SRG_AV_RETRAIT
    - MT_BCB_PROJ
    - MT_SRG_AFTER_WD
    - SRG_RESET_NOW
    - VOLUNTARY_RESET_ELIGIBLE
    - PC_GAR_DECES_CURRENT
    - MRV_BASE
    - MT_MRV_MRG_MRA_PROJ
    - TAUX_MRV_MRG_MRA_PROJ
    - MT_MIN_FERR_PROJ
    - ANNEE_ECH_PROJ
    - MOIS_ECH_PROJ

    # Survival and mortality
    - TX_SURVIE
    - TX_SURVIE_DEB
    - QX_MONTHLY

    # Lapse calculations
    - VM_VG_RATIO
    - LAPSE_NIV_TOT
    - LAPSE_NIV_PART
    - LAPSE_TOT_MIN_VAL
    - LAPSE_TOT_MAX_VAL
    - LAPSE_PART_MIN_VAL
    - LAPSE_PART_MAX_VAL
    - FACT_DIM_VAL
    - LAPSE_TOT
    - LAPSE_PART
    - LAPSE

    # Withdrawals and deposits
    - RETRAIT
    - RETRAIT_FINAL
    - DEPOT_FUTUR

    # Cash flows
    - FRAIS_ACQUIS
    - COMM_VENTE
    - PRIMES_GARANTIES
    - PRIMES_VARIABLES
    - HON_GEST
    - COMM_MAINTIEN
    - FRAIS_FIXES
    - PREST_ECH
    - PREST_MRV
    - PREST_DECES
    - REM_COMP_INV

    # Commission rates
    - PC_COMMISSION_VENTE
    - PC_COMMISSION_MAINTIEN
    - PC_FRAIS_AN

    # Tracking variables
    - UNITE_COUVERTURE
    - VALEUR_MARCHANDE
    - VALEUR_GARANTIE
    - DEPOT_FUTUR_SURVIE
    - IS_ALIVE
    - VM_ZERO
    - REGULAR_VM_ZERO

    # Discount and forward rates
    - FORWARD_RATE_ADJ
    - TX_ACTUALISATION
    - VP_FRAIS_ACQUIS
    - VP_COMM_VENTE
    - VP_PRIMES_GARANTIES
    - VP_PRIMES_VARIABLES
    - VP_HON_GEST
    - VP_COMM_MAINTIEN
    - VP_FRAIS_FIXES
    - VP_PREST_ECH
    - VP_PREST_MRV
    - VP_PREST_DECES
    - VP_VALEUR_MARCHANDE

    # IFRS 17 cushions
    - CODE_CAT_PRODUIT
